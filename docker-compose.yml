name: salon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://salon:salon@postgres:5432/salon
      REDIS_URL: redis://redis:6379/0
    ports: ["${BACKEND_HOST_PORT:-8000}:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery-worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://salon:salon@postgres:5432/salon
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery-beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://salon:salon@postgres:5432/salon
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    env_file: ./frontend/.env.local
    ports: ["${FRONTEND_HOST_PORT:-3000}:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on: [backend]

volumes:
  pgdata:
  redisdata:
