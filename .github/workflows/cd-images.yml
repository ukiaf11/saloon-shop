name: Publish container images

# The real deployment path. Builds the backend and frontend production images
# and pushes them to GHCR, so any host that can run containers (VPS, Fly, Render,
# ECS, a Docker Compose box) can pull a known-good build.
#
# Nothing here deploys to a server yet -- there is no server. When one exists,
# add a deploy job that pulls these tags. Until then GitHub Pages carries the
# static preview (see pages.yml), which cannot run the API.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # One failing image should not hide whether the other builds.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: prod
          - name: frontend
            context: ./frontend
            target: prod

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token: no personal access token needs to live in this repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke-test the backend image
        if: matrix.name == 'backend'
        run: |
          # Prove the image starts and its checks pass before anyone deploys it.
          # No database is attached, so this runs `check`, not a request.
          IMAGE="ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}"
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DJANGO_SECRET_KEY=ci-smoke-test-only-not-a-real-secret-value-padding \
            -e DJANGO_ALLOWED_HOSTS=example.com \
            -e CORS_ALLOWED_ORIGINS=https://example.com \
            -e CSRF_TRUSTED_ORIGINS=https://example.com \
            -e DATABASE_URL=postgres://u:p@localhost:5432/db \
            -e REDIS_URL=redis://localhost:6379/0 \
            "$IMAGE" python manage.py check --deploy
