[project]
name = "salon-backend"
version = "0.1.0"
description = "Salon Lucky Customer Platform - Django API"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0.9,<5.1",
    "djangorestframework>=3.15.2,<3.16",
    "django-environ>=0.11.2,<0.12",
    "django-cors-headers>=4.4.0,<5",
    "psycopg[binary]>=3.2.1,<4",
    "redis>=5.0.8,<6",
    "celery>=5.4.0,<6",
    "django-celery-beat>=2.7.0,<3",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.1",
    "qrcode[pil]>=7.4.2,<8",
    "Pillow>=10.4.0",
    "razorpay>=1.4.2,<2",
    "pyotp>=2.9.0",
    "django-storages[s3]>=1.14.4",
    "gunicorn>=23.0.0",
    "sentry-sdk>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.1",
    "factory-boy>=3.3.1",
    "ruff>=0.6.8",
    "django-debug-toolbar>=4.4.6",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "common", "config", "integrations", "tasks"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "S", "RUF"]
ignore = [
    "S101",   # assert: used deliberately for money invariants and in tests
    "N818",   # exception names: DomainError hierarchy reads better without Error suffix everywhere
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"config/settings/*" = ["F403", "F405"]
# RUF012 wants ClassVar annotations on mutable class attributes, but Django's
# Meta options (constraints, indexes, ordering) are plain lists by design.
"*/models.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "integrations", "tasks"]
